name: Trigger API Gateway Deploy

on:
  workflow_call:
    inputs:
      service_name:
        description: 'Name of the service triggering the API Gateway deploy (e.g. identity, cook)'
        required: true
        type: string
    secrets:
      GH_PAT:
        description: 'GitHub Personal Access Token or fine-grained token with workflow write permissions on tf-aws-api'
        required: true

jobs:
  trigger:
    name: Trigger tf-aws-api deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Dispatch workflow_dispatch on tf-aws-api
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/tec42/tf-aws-api/actions/workflows/deploy.yml/dispatches \
            -d "{\"ref\":\"main\",\"inputs\":{\"service_name\":\"${{ inputs.service_name }}\"}}")

          echo "HTTP status: $response"

          if [ "$response" != "204" ]; then
            echo "❌ Failed to trigger tf-aws-api deploy (HTTP $response)"
            exit 1
          fi

          echo "✅ tf-aws-api deploy triggered for service: ${{ inputs.service_name }}"
