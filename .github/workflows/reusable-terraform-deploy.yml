name: Terraform Deploy

on:
  workflow_call:
    inputs:
      terraform_dir:
        description: 'Path to terraform directory'
        required: false
        type: string
        default: 'terraform'
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.7.0'
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
      TF_MODULES_SSH_KEY:
        description: 'SSH private key for cloning private Terraform modules (Deploy Key)'
        required: false
    outputs:
      terraform_outputs:
        description: 'JSON string of terraform outputs'
        value: ${{ jobs.terraform.outputs.tf_outputs }}

permissions:
  id-token: write    # Required for OIDC
  contents: read     # Required for checkout

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    outputs:
      tf_outputs: ${{ steps.outputs.outputs.values }}
    
    defaults:
      run:
        working-directory: ${{ inputs.terraform_dir }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for potential git-based logic

      - name: � Setup SSH for private Terraform modules
        if: ${{ secrets.TF_MODULES_SSH_KEY != '' }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_KEY }}

      - name: �🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-Terraform

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: true  # Enables outputs capture

      - name: 🔧 Terraform Init
        id: init
        run: terraform init

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate

      - name: 📋 Terraform Plan
        id: plan
        run: terraform plan -out=tfplan -input=false

      - name: 📦 Upload Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()  # Upload even on failure for debugging
        with:
          name: terraform-plan-${{ github.run_number }}
          path: ${{ inputs.terraform_dir }}/tfplan
          retention-days: 30

      - name: 🚀 Terraform Apply
        id: apply
        run: terraform apply -input=false tfplan

      - name: 📤 Capture Terraform Outputs
        id: outputs
        run: |
          OUTPUTS=$(terraform output -json)
          echo "values<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📊 Display Summary
        if: always()
        run: |
          echo "### Terraform Deployment Summary 🏗️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Directory:** \`${{ inputs.terraform_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.terraform_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ inputs.aws_region }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Terraform Outputs:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            terraform output -json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed at step: ${{ steps.init.outcome == 'failure' && 'init' || steps.validate.outcome == 'failure' && 'validate' || steps.plan.outcome == 'failure' && 'plan' || 'apply' }}" >> $GITHUB_STEP_SUMMARY
          fi
