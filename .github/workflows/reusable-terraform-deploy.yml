name: Terraform Deploy

on:
  workflow_call:
    inputs:
      terraform_dir:
        description: 'Path to terraform directory'
        required: false
        type: string
        default: 'terraform'
      terraform_version:
        description: 'Terraform version'
        required: false
        type: string
        default: '1.12.0'
      aws_region:
        description: 'AWS region'
        required: false
        type: string
        default: 'eu-central-1'
      use_ssh_agent:
        description: 'Whether to setup SSH agent for private Terraform modules'
        required: false
        type: boolean
        default: false
      image_tag:
        description: 'Docker image tag to pass as TF_VAR_image_tag (optional)'
        required: false
        type: string
        default: ''
    secrets:
      AWS_ROLE_ARN:
        description: 'AWS IAM Role ARN for OIDC authentication'
        required: true
      TF_MODULES_SSH_KEY:
        description: 'SSH private key for cloning private Terraform modules (Deploy Key)'
        required: false
    outputs:
      terraform_outputs:
        description: 'JSON string of terraform outputs'
        value: ${{ jobs.terraform.outputs.tf_outputs }}

permissions:
  id-token: write    # Required for OIDC
  contents: read     # Required for checkout

jobs:
  terraform:
    name: Terraform Deploy
    runs-on: ubuntu-latest
    outputs:
      tf_outputs: ${{ steps.outputs.outputs.values }}
    
    defaults:
      run:
        working-directory: ${{ inputs.terraform_dir }}
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for potential git-based logic

      - name: 🔑 Setup SSH for private Terraform modules
        if: ${{ inputs.use_ssh_agent }}
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.TF_MODULES_SSH_KEY }}

      - name: 🔍 Debug SSH connection
        if: ${{ inputs.use_ssh_agent }}
        run: |
          echo "SSH_AUTH_SOCK: $SSH_AUTH_SOCK"
          ssh-add -l || echo "No keys loaded"
          ssh -T git@github.com 2>&1 || true

      - name: �🔐 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          role-session-name: GitHubActions-Terraform

      - name: 🏗️ Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform_version }}
          terraform_wrapper: true  # Enables outputs capture


      - name: �🔧 Terraform Init
        id: init
        run: terraform init

      - name: ✅ Terraform Validate
        id: validate
        run: terraform validate

      - name: 📋 Terraform Plan
        id: plan
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || '' }}
        run: terraform plan -out=tfplan -input=false

      - name: 📦 Upload Plan Artifact
        uses: actions/upload-artifact@v4
        if: always()  # Upload even on failure for debugging
        with:
          name: terraform-plan-${{ github.run_number }}
          path: ${{ inputs.terraform_dir }}/tfplan
          retention-days: 30

      # Post-mortem 2026-08-13 action P5. Refuses to apply a plan that would replace an ECS service
      # whose configured target group has no load balancer attached.
      #
      # ECS cannot create a service against an unattached target group. If the plan destroys the
      # service first, the apply fails after the destroy has already happened and no service is left
      # — a `git revert` produces the same plan and fails identically. That is what took
      # vehicle-manager down for eight hours.
      #
      # Every NLB service now holds its blue group with a keepalive listener (TD-009), so this check
      # should never fire. It exists for the case that guarantee is missing: a newly bootstrapped
      # service whose keepalive listener was skipped, or one where it was deleted or handed to
      # CodeDeploy.
      - name: 🛡️ Pre-flight - refuse to strand an ECS service
        run: |
          set -euo pipefail
          terraform show -json tfplan > tfplan.json

          # Resources being replaced or destroyed-then-created, with the target group they name.
          jq -r '
            [ .resource_changes[]?
              | select(.type == "aws_ecs_service")
              | select(.change.actions == ["delete","create"] or .change.actions == ["create","delete"])
              | { addr: .address,
                  tg: ( .change.after.load_balancer[0].target_group_arn
                        // .change.before.load_balancer[0].target_group_arn ) }
            ] | .[] | "\(.addr)\t\(.tg // "")"
          ' tfplan.json > replacements.txt || true

          if [ ! -s replacements.txt ]; then
            echo "✅ No ECS service replacement in this plan."
            exit 0
          fi

          echo "⚠️  This plan replaces an ECS service. Verifying its target group is attached."
          FAILED=0
          while IFS=$'\t' read -r ADDR TG; do
            if [ -z "$TG" ] || [ "$TG" = "null" ]; then
              echo "❓ $ADDR — target group ARN is not known at plan time, cannot verify."
              echo "   Check by hand before continuing:"
              echo "   aws elbv2 describe-target-groups --target-group-arns <arn> --query 'TargetGroups[0].LoadBalancerArns'"
              FAILED=1
              continue
            fi
            LBS=$(aws elbv2 describe-target-groups --target-group-arns "$TG" \
                    --query 'length(TargetGroups[0].LoadBalancerArns)' --output text 2>/dev/null || echo "ERR")
            if [ "$LBS" = "ERR" ]; then
              echo "❓ $ADDR — could not read $TG. Treating as unsafe."
              FAILED=1
            elif [ "$LBS" = "0" ]; then
              echo "❌ $ADDR would be destroyed and could NOT be recreated."
              echo "   Its target group has no load balancer attached:"
              echo "   $TG"
              echo "   Applying this plan would leave no service. See Platform TD-009."
              echo "   Fix: give the service a keepalive listener pointing at that group, then re-run."
              FAILED=1
            else
              echo "✅ $ADDR — target group attached to $LBS load balancer(s)."
            fi
          done < replacements.txt

          if [ "$FAILED" != "0" ]; then
            echo ""
            echo "Refusing to apply. This is post-mortem action P5; it exists because the"
            echo "alternative was an eight-hour outage on 2026-08-13."
            exit 1
          fi

      - name: 🚀 Terraform Apply
        id: apply
        env:
          TF_VAR_image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || '' }}
          AWS_MAX_ATTEMPTS: "5"
          AWS_RETRY_MODE: "adaptive"
        run: terraform apply -input=false tfplan

      - name: 🔄 Recovery - Push errored state
        if: failure() && steps.apply.outcome == 'failure'
        env:
          AWS_MAX_ATTEMPTS: "5"
          AWS_RETRY_MODE: "adaptive"
        run: |
          if [ -f "errored.tfstate" ]; then
            echo "⚠️ Found errored.tfstate — attempting state push recovery..."
            terraform state push errored.tfstate
            echo "✅ State recovered successfully"
          else
            echo "ℹ️ No errored.tfstate found — state push was not the issue"
          fi

      - name: 📤 Capture Terraform Outputs
        id: outputs
        run: |
          OUTPUTS=$(terraform output -json)
          echo "values<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUTS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 📊 Display Summary
        if: always()
        run: |
          echo "### Terraform Deployment Summary 🏗️" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Directory:** \`${{ inputs.terraform_dir }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`${{ inputs.terraform_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Region:** \`${{ inputs.aws_region }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ steps.apply.outcome }}" == "success" ]; then
            echo "**Status:** ✅ Success" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Terraform Outputs:" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            terraform output -json >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status:** ❌ Failed at step: ${{ steps.init.outcome == 'failure' && 'init' || steps.validate.outcome == 'failure' && 'validate' || steps.plan.outcome == 'failure' && 'plan' || 'apply' }}" >> $GITHUB_STEP_SUMMARY
          fi
